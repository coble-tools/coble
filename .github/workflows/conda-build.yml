name: Conda Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.5.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.ANACONDA_TOKEN }}" ]; then
            echo "ANACONDA_TOKEN is not set!"; exit 1
          else
            echo "ANACONDA_TOKEN is set"
          fi
          if [ -z "${{ secrets.ANACONDA_USER }}" ]; then
            echo "ANACONDA_USER is not set!"; exit 1
          else
            echo "ANACONDA_USER is set"
          fi

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: build-conda
          auto-activate-base: false

      - name: Install build tools
        shell: bash -el {0}
        run: |
          conda install -c conda-forge conda-build anaconda-client conda-index -y

      - name: Set versions in release files
        run: |
          sed -i "s/{% set version = \".*\" %}/{% set version = \"${{ github.event.inputs.version }}\" %}/" conda-recipe/meta.yaml
          sed -i "s/^  number: .*/  number: 0/" conda-recipe/meta.yaml
          sed -i "s/^version: .*/version: ${{ github.event.inputs.version }}/" CITATION.cff
          sed -i "s/^VERSION=\".*\"/VERSION=\"${{ github.event.inputs.version }}\"/" code/coble

      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/coble-tools/coble.git
          # Only stash if there are actual changes
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash
            STASHED=true
          fi
          git pull --rebase origin main

          if [ "$STASHED" = "true" ]; then
            git stash pop
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add conda-recipe/meta.yaml CITATION.cff code/coble
            git commit -m "Release v${{ github.event.inputs.version }}"
          else
            echo "Nothing to commit, skipping."
          fi


          git tag "v${{ github.event.inputs.version }}"
          git push origin main
          git push origin "v${{ github.event.inputs.version }}"

      - name: Build conda package
        shell: bash -el {0}
        run: |
          conda build conda-recipe/

      - name: Upload to Anaconda.org
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda --token $ANACONDA_API_TOKEN upload \
            --user ${{ secrets.ANACONDA_USER }} \
            --label main \
            /usr/share/miniconda/envs/build-conda/conda-bld/noarch/coble-${{ github.event.inputs.version }}-0.conda