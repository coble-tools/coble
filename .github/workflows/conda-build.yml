name: Conda Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: build-conda
          auto-activate-base: false

      - name: Install build tools
        shell: bash -el {0}
        run: |
          conda install -c conda-forge conda-build anaconda-client conda-index -y

      - name: Bump version in meta.yaml
        id: version
        shell: bash -el {0}
        run: |
          # Extract current version
          CURRENT=$(grep '{% set version' conda-recipe/meta.yaml | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT"

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          if [ "${{ github.event.inputs.bump }}" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          else
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Update meta.yaml
          sed -i "s/{% set version = \".*\" %}/{% set version = \"$NEW_VERSION\" %}/" conda-recipe/meta.yaml
          # Reset build number to 0
          sed -i "s/^  number: .*/  number: 0/" conda-recipe/meta.yaml

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/coble-tools/coble.git
          git pull --rebase origin main
          git add conda-recipe/meta.yaml
          git commit -m "Release v${{ steps.version.outputs.new_version }}"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Build conda package
        shell: bash -el {0}
        run: |
          conda build conda-recipe/

      - name: Upload to Anaconda.org
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda --token $ANACONDA_API_TOKEN upload \
            --user ${{ secrets.ANACONDA_USER }} \
            /usr/share/miniconda/envs/build-conda/conda-bld/noarch/coble-${{ steps.version.outputs.new_version }}-0.conda